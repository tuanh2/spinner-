<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenLayer Spinner Options</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#fff;font-family:-apple-system,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
h1{font-size:28px;font-weight:700;margin-bottom:8px;text-align:center}
h1 span{color:#df16ff}
p.sub{color:#666;font-size:13px;margin-bottom:40px;text-align:center}
.row{display:flex;gap:40px;margin-bottom:40px;flex-wrap:wrap;justify-content:center}
.opt{display:flex;flex-direction:column;gap:0;border-radius:16px;overflow:hidden;border:1px solid #222}
.opt-label{background:#1a1a1a;padding:12px 24px;text-align:center;font-size:13px;font-weight:600;letter-spacing:.05em;color:#999;border-bottom:1px solid #222}
.tile{width:240px;height:240px;display:flex;justify-content:center;align-items:center;position:relative}
.tile.dark{background:#0a0a0a}
.tile.white{background:#ffffff}
.tile-label{position:absolute;bottom:8px;right:10px;font-size:9px;font-family:monospace;letter-spacing:.05em}
.tile.dark .tile-label{color:#333}
.tile.white .tile-label{color:#ddd}
.s{width:80px;height:80px;position:relative}
.s svg{width:100%;height:100%;position:absolute;top:0;left:0}
.s .wire path{fill:none;stroke-width:1.5;stroke-linejoin:round}
.dark .s .wire path{stroke:#1a1a1a}
.white .s .wire path{stroke:#e0e0e0}
.s .neon path{fill:none;stroke:#df16ff;stroke-width:2;stroke-linecap:round;animation:np 3s ease-in-out infinite}
.dark .s .neon path{filter:drop-shadow(0 0 1px #df16ff) drop-shadow(0 0 3px #df16ff)}
.white .s .neon path{filter:drop-shadow(0 0 1px #df16ff) drop-shadow(0 0 4px #df16ff)}
.s .t1 path{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:12 248;animation:ch 2.5s linear infinite}
.dark .s .t1 path{stroke:#fff;filter:drop-shadow(0 0 1px #df16ff) drop-shadow(0 0 3px #df16ff)}
.white .s .t1 path{stroke:#9c13bf;filter:drop-shadow(0 0 1px #df16ff) drop-shadow(0 0 3px #df16ff)}
.s .t2 path{fill:none;stroke:#df16ff;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:8 252;animation:ch 2.5s linear infinite .2s;opacity:.6}
.dark .s .t2 path{filter:drop-shadow(0 0 1px #df16ff)}
.white .s .t2 path{filter:drop-shadow(0 0 1px #df16ff)}
.s .t3 path{fill:none;stroke:#9c13bf;stroke-width:1;stroke-linecap:round;stroke-dasharray:5 255;animation:ch 2.5s linear infinite .4s;opacity:.3}
.white .s .t3 path{stroke:#df16ff;opacity:.25}
.dark .s .neon path{animation-name:npd}
@keyframes np{0%,100%{opacity:.2}50%{opacity:.8}}
@keyframes npd{0%,100%{opacity:.2;filter:drop-shadow(0 0 1px #df16ff)}50%{opacity:.8;filter:drop-shadow(0 0 2px #df16ff) drop-shadow(0 0 6px #df16ff)}}
@keyframes ch{0%{stroke-dashoffset:270}100%{stroke-dashoffset:-270}}
.s .l path{fill:none;stroke:#df16ff;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:60 200;animation:s1 2s ease-in-out infinite}
.dark .s .l path{}
.white .s .l path{stroke:#df16ff}
.s .r path{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-dasharray:60 200;animation:s2 2s ease-in-out infinite}
.dark .s .r path{stroke:#fff}
.white .s .r path{stroke:#000}
.s .c path{fill:none;stroke:#9c13bf;stroke-width:2;stroke-linecap:round;stroke-dasharray:30 230;animation:s3 2s ease-in-out infinite}
.dark .s .c path{}
.white .s .c path{stroke:#9c13bf}
@keyframes s1{0%{transform:translate(0,0);opacity:1;stroke-dashoffset:260}30%{stroke-dashoffset:0;opacity:1}50%{transform:translate(-3px,-2px);opacity:.8}70%{transform:translate(-1px,1px);opacity:1}100%{transform:translate(0,0);stroke-dashoffset:-260;opacity:1}}
@keyframes s2{0%{transform:translate(0,0);opacity:1;stroke-dashoffset:-260}30%{stroke-dashoffset:0;opacity:1}50%{transform:translate(3px,2px);opacity:.8}70%{transform:translate(1px,-1px);opacity:1}100%{transform:translate(0,0);stroke-dashoffset:260;opacity:1}}
@keyframes s3{0%,20%{transform:translate(0,0);opacity:0;stroke-dashoffset:260}30%{opacity:1}40%{stroke-dashoffset:0;opacity:1}50%{transform:translate(0,0);opacity:1}60%{transform:translate(2px,-2px);opacity:.7}80%{transform:translate(-1px,1px);opacity:1}90%{opacity:1}100%{transform:translate(0,0);stroke-dashoffset:-260;opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition:none!important}}
.s .hex{width:200%;height:200%;left:-50%;top:-50%}
.s .hex path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.dark .s .hex path{stroke:rgba(255,255,255,.12)}
.white .s .hex path{stroke:rgba(0,0,0,.08)}
.s .hex .gl-edge{stroke-dasharray:17 83;animation:hex-chase 4s linear infinite}
.dark .s .hex .gl-edge{stroke:rgba(255,255,255,.9);filter:drop-shadow(0 0 2px rgba(255,255,255,.5))}
.white .s .hex .gl-edge{stroke:rgba(0,0,0,.7);filter:drop-shadow(0 0 2px rgba(0,0,0,.3))}
@keyframes hex-chase{0%{stroke-dashoffset:100}100%{stroke-dashoffset:-100}}
.opt:first-child .s{width:56px;height:56px}
.opt:last-child .s{width:140px;height:140px}
.opt:first-child .dark .s .wire path{stroke:none;fill:url(#go1d)}
.opt:first-child .dark .s .neon path{stroke:#e619c9;fill:none;filter:drop-shadow(0 0 1px #e619c9) drop-shadow(0 0 3px #e619c9);animation:np2 3s ease-in-out infinite}
.opt:first-child .dark .s .t1 path{stroke:#e619c9;fill:none;stroke-dasharray:15 225;animation:ch2 2.5s linear infinite;filter:drop-shadow(0 0 1px #e619c9) drop-shadow(0 0 3px #e619c9)}
.opt:first-child .dark .s .t2 path{stroke:#8b5cf6;fill:none;stroke-dasharray:10 230;animation:ch2 2.5s linear infinite .2s;opacity:.6;filter:drop-shadow(0 0 1px #8b5cf6)}
.opt:first-child .dark .s .t3 path{stroke:#22d3ee;fill:none;stroke-dasharray:6 234;animation:ch2 2.5s linear infinite .4s;opacity:.3;filter:drop-shadow(0 0 1px #22d3ee)}
.opt:first-child .white .s .wire path{stroke:none;fill:url(#go1w)}
.opt:first-child .white .s .neon path{stroke:#e619c9;fill:none;filter:drop-shadow(0 0 1px #e619c9) drop-shadow(0 0 4px #e619c9);animation:np2 3s ease-in-out infinite}
.opt:first-child .white .s .t1 path{stroke:#e619c9;fill:none;stroke-dasharray:15 225;animation:ch2 2.5s linear infinite;filter:drop-shadow(0 0 1px #e619c9) drop-shadow(0 0 3px #e619c9)}
.opt:first-child .white .s .t2 path{stroke:#8b5cf6;fill:none;stroke-dasharray:10 230;animation:ch2 2.5s linear infinite .2s;opacity:.6;filter:drop-shadow(0 0 1px #8b5cf6)}
.opt:first-child .white .s .t3 path{stroke:#22d3ee;fill:none;stroke-dasharray:6 234;animation:ch2 2.5s linear infinite .4s;opacity:.3}
@keyframes ch2{0%{stroke-dashoffset:250}100%{stroke-dashoffset:-250}}
@keyframes np2{0%,100%{opacity:.15}50%{opacity:.7}}
</style>
