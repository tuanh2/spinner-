<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenLayer Spinner Variants</title>
<style>
:root{--bg:#0f0f0f;--surface:#161616;--border:#222;--text:#eee;--muted:#888;--purple:#a855f7;--purple-dim:#7c3aed}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:40px 24px 80px}
header{text-align:center;margin-bottom:48px}
h1{font-size:clamp(24px,5vw,40px);font-weight:700;letter-spacing:-.03em;margin-bottom:8px}
h1 span{color:var(--purple)}
p.sub{color:var(--muted);font-size:14px}
.controls{display:flex;justify-content:center;gap:12px;margin-top:20px}
.btn{padding:6px 16px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;transition:all .2s}
.btn:hover,.btn.active{border-color:var(--purple);color:var(--purple)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:14px;transition:border-color .2s,transform .2s;cursor:default}
.card:hover{border-color:var(--purple);transform:translateY(-2px)}
.card .spinner{width:80px;height:80px}
.card .spinner iframe{width:100%;height:100%;border:none}
.card .label{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.02em}
.card .num{font-size:9px;color:#444;font-family:monospace}
footer{text-align:center;margin-top:48px;padding-top:24px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
footer a{color:var(--purple);text-decoration:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>GenLayer Spinner <span>Variants</span></h1>
<p class="sub">20 cyber wireframe loading spinners — pure CSS, zero JS</p>
<div class="controls">
<button class="btn active" onclick="setBg('#0f0f0f',this)">Dark</button>
<button class="btn" onclick="setBg('#ffffff',this)">Light</button>
<button class="btn" onclick="setBg('#1a1025',this)">Purple</button>
</div>
</header>
<div class="grid" id="grid"></div>
<footer><p>GenLayer Spinner Variants — MIT License</p></footer>
</div>
<script>
const spinners=[
{id:'01',name:'Trace Run',file:'01-trace-run.html'},
{id:'02',name:'Binary Flow',file:'02-binary-flow.html'},
{id:'03',name:'Vertex Blink',file:'03-vertex-blink.html'},
{id:'04',name:'Dual Chase',file:'04-dual-chase.html'},
{id:'05',name:'Segment Light',file:'05-segment-light.html'},
{id:'06',name:'Matrix Rain',file:'06-matrix-rain.html'},
{id:'07',name:'Neon Edge',file:'07-neon-edge.html'},
{id:'08',name:'Scan Reveal',file:'08-scan-reveal.html'},
{id:'09',name:'Data Stream',file:'09-data-stream.html'},
{id:'10',name:'Blink Grid',file:'10-blink-grid.html'},
{id:'11',name:'Circuit Trace',file:'11-circuit-trace.html'},
{id:'12',name:'Ripple Vertex',file:'12-ripple-vertex.html'},
{id:'13',name:'Fade Trail',file:'13-fade-trail.html'},
{id:'14',name:'Intersect',file:'14-intersect.html'},
{id:'15',name:'Wireframe Rotate',file:'15-wireframe-rotate.html'},
{id:'16',name:'Glitch Decode',file:'16-glitch-decode.html'},
{id:'17',name:'Pulse Ring',file:'17-pulse-ring.html'},
{id:'18',name:'Shatter',file:'18-shatter.html'},
{id:'19',name:'Fill Sweep',file:'19-fill-sweep.html'},
{id:'20',name:'Data Matrix',file:'20-data-matrix.html'}
];

const grid=document.getElementById('grid');
spinners.forEach(s=>{
const card=document.createElement('div');
card.className='card';
card.innerHTML='<div class="num">'+s.id+'</div><div class="spinner"><iframe src="../spinners/'+s.file+'" loading="lazy"></iframe></div><div class="label">'+s.name+'</div>';
grid.appendChild(card);
});

function setBg(color,btn){
document.documentElement.style.setProperty('--bg',color);
document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
}
</script>
</body>
</html>
